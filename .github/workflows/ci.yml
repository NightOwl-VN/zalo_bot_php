name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: [8.1, 8.2, 8.3, 8.4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, mbstring, json
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php-version }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Verify syntax (php -l)
        run: |
          find src/ tests/ examples/ -name '*.php' -print0 | xargs -0 -n1 -I{} php -l {}

      - name: Run tests
        run: composer test

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: curl, mbstring, json
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Validate composer.json strictly
        run: composer validate --strict

      - name: Run test suite
        run: composer test

      - name: Run PHPStan static analysis
        run: composer phpstan

      - name: Check coding standard (no fallback allowed)
        run: composer cs-check

      - name: Verify no hardcoded secrets
        run: |
          echo "Scanning for hardcoded secrets..."
          ! grep -rnE "(sk-|ghp_|glpat-|xox[bpsar]-|AKIA[A-Z0-9]{16})" src/ examples/ || {
            echo "ERROR: Potential hardcoded secret detected!"
            exit 1
          }
          ! grep -rnE "(ZALO_BOT_TOKEN|ZALO_BOT_SECRET|botToken|secretKey)\s*[:=]\s*['\"][a-zA-Z0-9_-]{20,}['\"]" src/ examples/ || {
            echo "ERROR: Potential hardcoded credential detected!"
            exit 1
          }
          echo "No hardcoded secrets found."

  consumer-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: curl, mbstring, json
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Consumer smoke test (fresh consumer project, --no-dev, no network)
        run: bash scripts/consumer-smoke.sh

  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: curl, mbstring, json
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Verify package contents
        run: composer validate --strict
